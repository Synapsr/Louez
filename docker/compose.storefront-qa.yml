name: louez-storefront-qa
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: louez_storefront_qa
      MYSQL_USER: storefront_qa
      MYSQL_PASSWORD: ${QA_DB_PASSWORD:?Run pnpm qa:storefront setup}
      MYSQL_ROOT_PASSWORD: ${QA_DB_ROOT_PASSWORD:?Run pnpm qa:storefront setup}
    ports: ["127.0.0.1::3306"]
    volumes: ["database:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 2s
      timeout: 3s
      retries: 60
  mail:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports: ["127.0.0.1::1025", "127.0.0.1::8025"]
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: storefront-qa
      MINIO_ROOT_PASSWORD: ${QA_STORAGE_PASSWORD:?Run pnpm qa:storefront setup}
    ports: ["127.0.0.1::9000"]
    volumes: ["storage:/data"]
volumes:
  database:
  storage:
