name: CI

# Formatting, lint, types and every node:test suite, on each pull request and on main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Format, lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm type-check

  # The suites run as three jobs side by side, each on its own MySQL server:
  # the API's and the web app's are the long ones, and together they no longer
  # fit one job's time.
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            run: pnpm exec turbo run test --continue --filter=@louez/api
          - name: web
            run: pnpm exec turbo run test --continue --filter=@louez/web
          - name: others
            run: >-
              pnpm exec turbo run test --continue --filter=!@louez/api --filter=!@louez/web
              && node --test "scripts/**/*.test.mjs"
    # A throwaway MySQL server for the database suites.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: louez_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # A server URL: each suite that uses @louez/db/testing creates its own
      # database there. Those suites fail in CI when the variable is missing.
      TEST_DATABASE_URL: mysql://root:ci@127.0.0.1:3306
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate the test database
        run: pnpm --filter @louez/db db:migrate:run
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}/louez_test
      - run: ${{ matrix.run }}
        env:
          # The pricing-lock suite runs alone on louez_test, migrated above.
          PRICING_LOCK_TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}/louez_test

  # One check for the three jobs above, under the name the branch protection asks for.
  tests:
    name: Tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.test.result }}" = "success"
