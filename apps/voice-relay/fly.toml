# Deploy from the monorepo root: fly deploy --config apps/voice-relay/fly.toml
app = "louez-voice-relay"
primary_region = "cdg" # change to match the app's region

[build]
  dockerfile = "apps/voice-relay/Dockerfile"

[env]
  PORT = "8080"

# Persistent WebSocket sessions: keep at least one machine always running and
# never auto-stop, otherwise in-flight calls would be dropped.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 40
    hard_limit = 50

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
